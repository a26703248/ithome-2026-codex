<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Codex 驗證流程</title><desc id="desc">從網路權限受阻、測試失敗、最小修改到測試通過</desc>
  <rect width="960" height="540" fill="#f1f5f9"/><text x="48" y="56" fill="#0f172a" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="37" font-weight="800">結果不是一句「完成」</text><text x="48" y="91" fill="#64748b" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="22">每一步都留下可核對的證據</text>
  <g font-family="Arial, 'Microsoft JhengHei', sans-serif">
    <rect x="48" y="118" width="392" height="145" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><circle cx="91" cy="161" r="23" fill="#f97316"/><text x="91" y="170" text-anchor="middle" fill="white" font-size="22" font-weight="800">1</text><text x="128" y="171" fill="#9a3412" font-size="29" font-weight="800">網路權限受阻</text><text x="78" y="218" fill="#7c2d12" font-size="24">Maven 外掛無法下載</text><text x="78" y="248" fill="#c2410c" font-size="21">尚未進入測試</text>
    <path d="M452 190 H488" stroke="#94a3b8" stroke-width="7"/><path d="M476 178 L491 190 L476 202" fill="none" stroke="#94a3b8" stroke-width="7"/>
    <rect x="500" y="118" width="412" height="145" rx="22" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/><circle cx="543" cy="161" r="23" fill="#ef4444"/><text x="543" y="170" text-anchor="middle" fill="white" font-size="22" font-weight="800">2</text><text x="580" y="171" fill="#991b1b" font-size="29" font-weight="800">重現缺陷</text><text x="530" y="218" fill="#7f1d1d" font-size="24">Tests run: 3　Failures: 2</text><text x="530" y="248" fill="#b91c1c" font-size="21">先以測試證明問題存在</text>
    <path d="M706 273 V299" stroke="#94a3b8" stroke-width="7"/><path d="M694 289 L706 303 L718 289" fill="none" stroke="#94a3b8" stroke-width="7"/>
    <rect x="48" y="309" width="392" height="145" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><circle cx="91" cy="352" r="23" fill="#0891b2"/><text x="91" y="361" text-anchor="middle" fill="white" font-size="22" font-weight="800">3</text><text x="128" y="362" fill="#155e75" font-size="29" font-weight="800">最小修改</text><text x="78" y="409" fill="#164e63" font-size="24">忽略大小寫；先排序再分頁</text><text x="78" y="439" fill="#0e7490" font-size="21">不擴張本次任務邊界</text>
    <path d="M452 381 H488" stroke="#94a3b8" stroke-width="7"/><path d="M476 369 L491 381 L476 393" fill="none" stroke="#94a3b8" stroke-width="7"/>
    <rect x="500" y="309" width="412" height="145" rx="22" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/><circle cx="543" cy="352" r="23" fill="#22c55e"/><text x="543" y="361" text-anchor="middle" fill="white" font-size="22" font-weight="800">4</text><text x="580" y="362" fill="#166534" font-size="29" font-weight="800">測試通過</text><text x="530" y="409" fill="#14532d" font-size="24">3／3 通過</text><text x="530" y="439" fill="#166534" font-size="21">分類篩選測試通過</text>
  </g>
  <rect x="48" y="478" width="864" height="42" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="480" y="506" text-anchor="middle" fill="#92400e" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="700">未驗證：前後空白、特殊字元、效能</text>
</svg>
