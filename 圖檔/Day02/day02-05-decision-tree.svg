<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">當前資訊是否明確：ChatGPT 與 Codex 工具選擇</title>
  <desc id="desc">ChatGPT 適合產出共同理解的證據，Codex 適合產出專案變更的證據；複雜任務可先對話釐清，再進入專案執行。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d32"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#10283d"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c38"/>
      <stop offset="1" stop-color="#102d2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="85" cy="85" r="155" fill="#22d3ee" opacity="0.045"/>
  <circle cx="885" cy="110" r="180" fill="#34d399" opacity="0.045"/>

  <rect x="300" y="28" width="360" height="52" rx="26" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="62" text-anchor="middle" fill="#e2e8f0" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="23" font-weight="700">當前資訊是否明確</text>

  <path d="M480 80 V124 H255 V137" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#cyanArrow)"/>
  <path d="M480 80 V124 H705 V137" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#greenArrow)"/>

  <g filter="url(#shadow)">
    <rect x="45" y="140" width="420" height="276" rx="24" fill="url(#cyanCard)" stroke="#22d3ee" stroke-width="2"/>
    <rect x="495" y="140" width="420" height="276" rx="24" fill="url(#greenCard)" stroke="#34d399" stroke-width="2"/>
  </g>

  <circle cx="78" cy="174" r="18" fill="#22d3ee"/>
  <path d="M69 169 h18 M69 176 h13 M69 183 h9" stroke="#083344" stroke-width="3" stroke-linecap="round"/>
  <text x="108" y="180" fill="#67e8f9" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="28" font-weight="800">ChatGPT</text>
  <rect x="276" y="156" width="169" height="36" rx="18" fill="#083344" stroke="#22d3ee" stroke-width="1"/>
  <text x="360.5" y="180" text-anchor="middle" fill="#a5f3fc" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="17" font-weight="700">資訊範圍不明確</text>
  <text x="69" y="214" fill="#bae6fd" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="17">先把未知、假設與判準說清楚</text>

  <g font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="19" font-weight="700">
    <rect x="65" y="229" width="380" height="47" rx="12" fill="#164e63" opacity="0.78"/>
    <circle cx="91" cy="252.5" r="14" fill="#22d3ee"/><text x="91" y="259" text-anchor="middle" fill="#083344">1</text>
    <text x="119" y="259" fill="#ecfeff">需要補問哪些資訊？</text>

    <rect x="65" y="287" width="380" height="47" rx="12" fill="#164e63" opacity="0.78"/>
    <circle cx="91" cy="310.5" r="14" fill="#22d3ee"/><text x="91" y="317" text-anchor="middle" fill="#083344">2</text>
    <text x="119" y="317" fill="#ecfeff">哪些是假設與來源？</text>

    <rect x="65" y="345" width="380" height="47" rx="12" fill="#164e63" opacity="0.78"/>
    <circle cx="91" cy="368.5" r="14" fill="#22d3ee"/><text x="91" y="375" text-anchor="middle" fill="#083344">3</text>
    <text x="119" y="375" fill="#ecfeff">驗收條件是否明確？</text>
  </g>

  <circle cx="528" cy="174" r="18" fill="#34d399"/>
  <path d="M519 174 l6 6 12-14" fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="558" y="180" fill="#6ee7b7" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="28" font-weight="800">Codex</text>
  <rect x="726" y="156" width="169" height="36" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="810.5" y="180" text-anchor="middle" fill="#a7f3d0" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="17" font-weight="700">資訊範圍明確</text>
  <text x="519" y="214" fill="#bbf7d0" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="17">在專案中完成修改並留下可驗證結果</text>

  <g font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="19" font-weight="700">
    <rect x="515" y="229" width="380" height="47" rx="12" fill="#065f46" opacity="0.72"/>
    <circle cx="541" cy="252.5" r="14" fill="#34d399"/><text x="541" y="259" text-anchor="middle" fill="#064e3b">1</text>
    <text x="569" y="259" fill="#f0fdf4">哪些檔案被修改？</text>

    <rect x="515" y="287" width="380" height="47" rx="12" fill="#065f46" opacity="0.72"/>
    <circle cx="541" cy="310.5" r="14" fill="#34d399"/><text x="541" y="317" text-anchor="middle" fill="#064e3b">2</text>
    <text x="569" y="317" fill="#f0fdf4">執行了哪些命令？</text>

    <rect x="515" y="345" width="380" height="47" rx="12" fill="#065f46" opacity="0.72"/>
    <circle cx="541" cy="368.5" r="14" fill="#34d399"/><text x="541" y="375" text-anchor="middle" fill="#064e3b">3</text>
    <text x="569" y="375" fill="#f0fdf4">測試結果是否通過？</text>
  </g>

  <rect x="105" y="430" width="750" height="72" rx="20" fill="#172033" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="142" y="473" fill="#fde68a" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="20" font-weight="800">接力流程</text>
  <rect x="250" y="447" width="148" height="38" rx="19" fill="#164e63"/>
  <text x="324" y="472" text-anchor="middle" fill="#cffafe" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="18" font-weight="700">先對話釐清</text>
  <path d="M410 466 H440" stroke="#fbbf24" stroke-width="4" marker-end="url(#cyanArrow)"/>
  <rect x="450" y="447" width="130" height="38" rx="19" fill="#3f3a22"/>
  <text x="515" y="472" text-anchor="middle" fill="#fef3c7" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="18" font-weight="700">邊界明確</text>
  <path d="M592 466 H622" stroke="#fbbf24" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect x="632" y="447" width="176" height="38" rx="19" fill="#065f46"/>
  <text x="720" y="472" text-anchor="middle" fill="#d1fae5" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="18" font-weight="700">進入專案執行</text>

  <text x="480" y="528" text-anchor="middle" fill="#cbd5e1" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="18" font-weight="700">複雜任務通常是接力，不是二選一</text>
</svg>
