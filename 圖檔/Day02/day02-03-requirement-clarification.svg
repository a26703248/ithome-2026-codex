<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">需求釐清前後對照</title><desc id="desc">把模糊回報轉為可驗證的問題報告</desc>
  <rect width="960" height="540" fill="#0f172a"/><text x="48" y="62" fill="#f8fafc" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="37" font-weight="800">從「怪怪的」到可驗證問題</text>
  <rect x="48" y="104" width="302" height="348" rx="24" fill="#fff7ed"/><text x="78" y="154" fill="#9a3412" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="30" font-weight="800">原始回報</text><text x="78" y="211" fill="#431407" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="27">「查詢結果</text><text x="78" y="249" fill="#431407" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="27">好像怪怪的」</text><line x1="78" y1="282" x2="320" y2="282" stroke="#fdba74" stroke-width="3"/><text x="78" y="325" fill="#9a3412" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="23">× 操作條件不明</text><text x="78" y="363" fill="#9a3412" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="23">× 預期與實際差異不明</text><text x="78" y="401" fill="#9a3412" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="23">× 無法驗收</text>
  <path d="M370 280 H436" stroke="#22d3ee" stroke-width="9"/><path d="M421 264 L440 280 L421 296" fill="none" stroke="#22d3ee" stroke-width="9"/><rect x="358" y="190" width="92" height="62" rx="28" fill="#155e75"/><text x="404" y="217" text-anchor="middle" fill="#cffafe" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="17" font-weight="700">ChatGPT</text><text x="404" y="239" text-anchor="middle" fill="#cffafe" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16">協助追問</text>
  <rect x="468" y="104" width="444" height="348" rx="24" fill="#ecfeff"/><text x="498" y="154" fill="#0e7490" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="29" font-weight="800">問題報告（Issue Report）</text><g fill="#164e63" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="23"><text x="498" y="207">✓ 角色、環境與重現步驟</text><text x="498" y="245">✓ 關鍵字、篩選、排序、分頁</text><text x="498" y="283">✓ 預期結果與實際結果</text><text x="498" y="321">✓ 例外情境與不可更動範圍</text><text x="498" y="359">✓ PM／工程師／QA 驗收方式</text></g><rect x="498" y="382" width="384" height="48" rx="12" fill="#fee2e2"/><text x="519" y="413" fill="#991b1b" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="20" font-weight="700">移除假設：一定是後端錯誤</text>
  <text x="480" y="504" text-anchor="middle" fill="#cbd5e1" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="24">ChatGPT 提供提問框架；需求事實仍由人確認</text>
</svg>
