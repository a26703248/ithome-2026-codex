<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT 與 Codex 工作心智模型</title><desc id="desc">比較兩個工具的輸入、工作與證據</desc>
  <rect width="960" height="540" fill="#f8fafc"/><text x="48" y="58" fill="#0f172a" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="38" font-weight="800">兩種工作心智模型</text><text x="48" y="96" fill="#64748b" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="24">輸入 → 工作 → 證據</text>
  <rect x="48" y="126" width="410" height="342" rx="24" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="78" y="178" fill="#0e7490" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="31" font-weight="800">ChatGPT｜共同理解</text>
  <rect x="78" y="207" width="350" height="62" rx="14" fill="#cffafe"/><text x="101" y="247" fill="#164e63" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="25">輸入：問題、對話、文件</text><path d="M253 277 V298" stroke="#0891b2" stroke-width="6"/><path d="M243 291 L253 304 L263 291" fill="none" stroke="#0891b2" stroke-width="6"/>
  <rect x="78" y="311" width="350" height="62" rx="14" fill="#a5f3fc"/><text x="101" y="351" fill="#164e63" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="25">工作：追問、整理、比較</text><path d="M253 381 V402" stroke="#0891b2" stroke-width="6"/><path d="M243 395 L253 408 L263 395" fill="none" stroke="#0891b2" stroke-width="6"/><text x="78" y="446" fill="#0e7490" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="24" font-weight="700">證據：來源、假設、人工確認</text>
  <rect x="502" y="126" width="410" height="342" rx="24" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="532" y="178" fill="#0f766e" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="31" font-weight="800">Codex｜專案變更</text>
  <rect x="532" y="207" width="350" height="62" rx="14" fill="#ccfbf1"/><text x="555" y="247" fill="#134e4a" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="25">輸入：任務、程式庫、環境</text><path d="M707 277 V298" stroke="#0f766e" stroke-width="6"/><path d="M697 291 L707 304 L717 291" fill="none" stroke="#0f766e" stroke-width="6"/>
  <rect x="532" y="311" width="350" height="62" rx="14" fill="#99f6e4"/><text x="555" y="351" fill="#134e4a" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="25">工作：讀檔、修改、執行</text><path d="M707 381 V402" stroke="#0f766e" stroke-width="6"/><path d="M697 395 L707 408 L717 395" fill="none" stroke="#0f766e" stroke-width="6"/><text x="532" y="446" fill="#0f766e" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="24" font-weight="700">證據：差異、命令、測試結果</text>
  <text x="480" y="514" text-anchor="middle" fill="#475569" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="25" font-weight="700">能力可以重疊，工作責任不能模糊</text>
</svg>
