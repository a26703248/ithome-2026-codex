<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Day 03 環境驗證</title><desc id="desc">購物車案例從失敗測試經最小修改到測試通過</desc><rect width="960" height="540" fill="#f1f5f9"/>
  <g font-family="Arial, 'Microsoft JhengHei', sans-serif"><text x="48" y="58" fill="#0f172a" font-size="38" font-weight="800">不是安裝完成，而是整條路徑可驗證</text><text x="48" y="92" fill="#64748b" font-size="22">購物車空清單缺陷的最短回饋迴圈</text>
    <rect x="48" y="130" width="400" height="135" rx="22" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/><circle cx="91" cy="171" r="23" fill="#ef4444"/><text x="91" y="180" text-anchor="middle" fill="white" font-size="22" font-weight="800">1</text><text x="128" y="181" fill="#991b1b" font-size="28" font-weight="800">重現缺陷</text><text x="78" y="223" fill="#7f1d1d" font-size="22">Tests run: 2　Errors: 1</text><text x="78" y="251" fill="#b91c1c" font-size="20">ArithmeticException: / by zero</text>
    <rect x="512" y="130" width="400" height="135" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><circle cx="555" cy="171" r="23" fill="#f97316"/><text x="555" y="180" text-anchor="middle" fill="white" font-size="22" font-weight="800">2</text><text x="592" y="181" fill="#9a3412" font-size="28" font-weight="800">辨認環境問題</text><text x="542" y="223" fill="#7c2d12" font-size="22">Maven 外掛下載受阻</text><text x="542" y="251" fill="#c2410c" font-size="20">尚未進入程式測試</text>
    <rect x="48" y="310" width="400" height="135" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><circle cx="91" cy="351" r="23" fill="#0891b2"/><text x="91" y="360" text-anchor="middle" fill="white" font-size="22" font-weight="800">3</text><text x="128" y="361" fill="#155e75" font-size="28" font-weight="800">最小修改</text><text x="78" y="403" fill="#164e63" font-size="22">空清單提前回傳 0</text><text x="78" y="431" fill="#0e7490" font-size="20">不改測試與折扣邏輯</text>
    <rect x="512" y="310" width="400" height="135" rx="22" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/><circle cx="555" cy="351" r="23" fill="#22c55e"/><text x="555" y="360" text-anchor="middle" fill="white" font-size="22" font-weight="800">4</text><text x="592" y="361" fill="#166534" font-size="28" font-weight="800">測試通過</text><text x="542" y="403" fill="#14532d" font-size="22">Tests run: 2　Errors: 0</text><text x="542" y="431" fill="#166534" font-size="20">人工檢查：未見無關重構</text>
    <path d="M460 197 H500" stroke="#94a3b8" stroke-width="7"/><path d="M488 185 L503 197 L488 209" fill="none" stroke="#94a3b8" stroke-width="7"/><path d="M712 278 V297" stroke="#94a3b8" stroke-width="7"/><path d="M700 287 L712 302 L724 287" fill="none" stroke="#94a3b8" stroke-width="7"/><path d="M500 377 H460" stroke="#94a3b8" stroke-width="7"/><path d="M472 365 L457 377 L472 389" fill="none" stroke="#94a3b8" stroke-width="7"/>
    <rect x="48" y="474" width="864" height="44" rx="14" fill="#0f172a"/><text x="480" y="503" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">先確認失敗在哪一層，再決定要改程式、環境或權限</text></g>
