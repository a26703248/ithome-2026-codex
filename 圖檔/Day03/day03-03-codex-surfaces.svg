<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Codex 四種入口</title><desc id="desc">App、CLI、IDE 與 cloud 連接本機或雲端環境</desc><rect width="960" height="540" fill="#081426"/>
  <g font-family="Arial, 'Microsoft JhengHei', sans-serif"><text x="48" y="58" fill="#f8fafc" font-size="38" font-weight="800">Codex：選擇靠近程式碼，或交給遠端</text><text x="48" y="92" fill="#94a3b8" font-size="22">所有入口都必須回到差異、測試與人工審查</text>
    <rect x="55" y="142" width="185" height="106" rx="20" fill="#164e63" stroke="#22d3ee" stroke-width="3"/><text x="148" y="185" text-anchor="middle" fill="#ecfeff" font-size="29" font-weight="800">Codex App</text><text x="148" y="221" text-anchor="middle" fill="#a5f3fc" font-size="21">專案與平行任務</text>
    <rect x="55" y="300" width="185" height="106" rx="20" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/><text x="148" y="343" text-anchor="middle" fill="#eff6ff" font-size="29" font-weight="800">CLI</text><text x="148" y="379" text-anchor="middle" fill="#bfdbfe" font-size="21">終端機與自動化</text>
    <rect x="720" y="142" width="185" height="106" rx="20" fill="#14532d" stroke="#4ade80" stroke-width="3"/><text x="813" y="185" text-anchor="middle" fill="#f0fdf4" font-size="29" font-weight="800">IDE</text><text x="813" y="221" text-anchor="middle" fill="#bbf7d0" font-size="21">開啟檔案與選取範圍</text>
    <rect x="720" y="300" width="185" height="106" rx="20" fill="#581c87" stroke="#c084fc" stroke-width="3"/><text x="813" y="343" text-anchor="middle" fill="#faf5ff" font-size="29" font-weight="800">cloud</text><text x="813" y="379" text-anchor="middle" fill="#e9d5ff" font-size="21">隔離環境與背景任務</text>
    <rect x="330" y="154" width="300" height="240" rx="32" fill="#f8fafc"/><rect x="370" y="194" width="220" height="72" rx="15" fill="#e2e8f0"/><circle cx="405" cy="230" r="17" fill="#0891b2"/><text x="435" y="240" fill="#0f172a" font-size="28" font-weight="800">程式碼庫</text><text x="480" y="310" text-anchor="middle" fill="#334155" font-size="24">檔案 · 工具 · 相依套件</text><text x="480" y="348" text-anchor="middle" fill="#334155" font-size="24">權限 · 測試 · Git</text>
    <path d="M250 195 H318" stroke="#22d3ee" stroke-width="7"/><path d="M305 183 L321 195 L305 207" fill="none" stroke="#22d3ee" stroke-width="7"/><path d="M250 353 H318" stroke="#60a5fa" stroke-width="7"/><path d="M305 341 L321 353 L305 365" fill="none" stroke="#60a5fa" stroke-width="7"/><path d="M710 195 H642" stroke="#4ade80" stroke-width="7"/><path d="M655 183 L639 195 L655 207" fill="none" stroke="#4ade80" stroke-width="7"/><path d="M710 353 H642" stroke="#c084fc" stroke-width="7"/><path d="M655 341 L639 353 L655 365" fill="none" stroke="#c084fc" stroke-width="7"/>
    <rect x="110" y="455" width="740" height="50" rx="16" fill="#0f766e"/><text x="480" y="488" text-anchor="middle" fill="#ecfeff" font-size="23" font-weight="700">入口改變操作距離，不改變驗收責任</text></g>
</svg>
