    <rect x="48" y="128" width="864" height="315" rx="28" fill="#0f172a"/><circle cx="82" cy="160" r="7" fill="#ef4444"/><circle cx="106" cy="160" r="7" fill="#f59e0b"/><circle cx="130" cy="160" r="7" fill="#22c55e"/>
