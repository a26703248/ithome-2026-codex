<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">最小可用 AI 開發環境</title><desc id="desc">實測環境包含 Windows、JDK、Maven、JUnit、Git、IDE、ChatGPT 與 Codex</desc><rect width="960" height="540" fill="#f8fafc"/>
