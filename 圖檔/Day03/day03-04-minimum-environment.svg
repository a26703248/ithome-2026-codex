    <text x="86" y="278" fill="#67e8f9" font-size="23" font-weight="700">建置與測試</text><text x="260" y="278" fill="#f8fafc" font-size="23">Maven 3.8.1　·　JUnit 5.10.2</text><line x1="86" y1="298" x2="874" y2="298" stroke="#334155"/>
