<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT 三種入口</title><desc id="desc">桌面應用程式、網頁與 API 依工作距離選擇</desc><rect width="960" height="540" fill="#f1f5f9"/>
  <g font-family="Arial, 'Microsoft JhengHei', sans-serif"><text x="48" y="58" fill="#0f172a" font-size="38" font-weight="800">ChatGPT 的入口，差在與工作的距離</text><text x="48" y="92" fill="#64748b" font-size="22">不是功能排名，而是互動、環境與整合方式不同</text>
    <rect x="48" y="130" width="270" height="300" rx="24" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><circle cx="183" cy="187" r="34" fill="#0891b2"/><rect x="165" y="171" width="36" height="28" rx="5" fill="none" stroke="white" stroke-width="4"/><text x="183" y="250" text-anchor="middle" fill="#164e63" font-size="33" font-weight="800">Desktop App</text><text x="183" y="294" text-anchor="middle" fill="#0e7490" font-size="25" font-weight="700">靠近本機工作</text><text x="183" y="338" text-anchor="middle" fill="#334155" font-size="22">檔案 · 桌面工具</text><text x="183" y="373" text-anchor="middle" fill="#334155" font-size="22">專案 · 長時間任務</text><rect x="88" y="394" width="190" height="46" rx="14" fill="#cffafe"/><text x="183" y="425" text-anchor="middle" fill="#155e75" font-size="21" font-weight="700">需要本機上下文</text>
    <rect x="345" y="130" width="270" height="300" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><circle cx="480" cy="187" r="34" fill="#2563eb"/><circle cx="480" cy="187" r="18" fill="none" stroke="white" stroke-width="4"/><path d="M462 187 H498 M480 169 V205" stroke="white" stroke-width="3"/><text x="480" y="250" text-anchor="middle" fill="#1e3a8a" font-size="33" font-weight="800">Web</text><text x="480" y="294" text-anchor="middle" fill="#1d4ed8" font-size="25" font-weight="700">瀏覽器即可開始</text><text x="480" y="338" text-anchor="middle" fill="#334155" font-size="22">對話 · 研究 · 專案</text><text x="480" y="373" text-anchor="middle" fill="#334155" font-size="22">檔案 · 外掛</text><rect x="385" y="394" width="190" height="46" rx="14" fill="#dbeafe"/><text x="480" y="425" text-anchor="middle" fill="#1e40af" font-size="21" font-weight="700">快速跨裝置使用</text>
    <rect x="642" y="130" width="270" height="300" rx="24" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><circle cx="777" cy="187" r="34" fill="#7c3aed"/><text x="777" y="197" text-anchor="middle" fill="white" font-size="27" font-weight="800">{ }</text><text x="777" y="250" text-anchor="middle" fill="#4c1d95" font-size="33" font-weight="800">OpenAI API</text><text x="777" y="294" text-anchor="middle" fill="#6d28d9" font-size="25" font-weight="700">由程式觸發</text><text x="777" y="338" text-anchor="middle" fill="#334155" font-size="22">批次 · 產品整合</text><text x="777" y="373" text-anchor="middle" fill="#334155" font-size="22">明確輸入與輸出</text><rect x="682" y="394" width="190" height="46" rx="14" fill="#ede9fe"/><text x="777" y="425" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="700">需要程式化流程</text>
    <rect x="48" y="462" width="864" height="48" rx="16" fill="#0f172a"/><text x="480" y="494" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">選擇依據：誰觸發？上下文在哪裡？成果要交給誰？</text></g>
