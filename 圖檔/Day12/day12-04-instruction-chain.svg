  </g>
  <rect x="360" y="795" width="1140" height="60" rx="18" fill="#020617"/>
  <text x="930" y="836" text-anchor="middle" fill="#f8fafc" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="700">同一目錄：AGENTS.override.md 優先於 AGENTS.md</text>
