  <text x="100" y="170" fill="#94a3b8" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="28">越靠近工作目錄的指令越晚加入，可覆蓋較早的通用規則</text>
  <path d="M250 300v410" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <path d="M250 710l-26-35h52z" fill="#64748b"/>
  <g transform="translate(170 240)">
    <circle cx="80" cy="60" r="55" fill="#3b82f6"/>
    <text x="80" y="72" text-anchor="middle" fill="white" font-family="Consolas" font-size="34" font-weight="800">ROOT</text>
    <rect x="190" width="1150" height="120" rx="24" fill="#0f1f3d" stroke="#3b82f6" stroke-width="4"/>
    <text x="235" y="52" fill="#bfdbfe" font-family="Consolas, monospace" font-size="31" font-weight="700">/AGENTS.md</text>
    <text x="235" y="91" fill="#cbd5e1" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="26">Java 變更後跑測試 · 回報 diff 與剩餘風險</text>
  </g>
  <g transform="translate(170 430)">
    <circle cx="80" cy="60" r="55" fill="#14b8a6"/>
    <text x="80" y="72" text-anchor="middle" fill="white" font-family="Consolas" font-size="28" font-weight="800">SERVICE</text>
    <rect x="190" width="1150" height="120" rx="24" fill="#0f2a28" stroke="#14b8a6" stroke-width="4"/>
    <text x="235" y="52" fill="#5eead4" font-family="Consolas, monospace" font-size="31" font-weight="700">/services/reporting/AGENTS.override.md</text>
    <text x="235" y="91" fill="#cbd5e1" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="26">報表模組使用指定測試命令 · 不修改排程介面</text>
  </g>
  <g transform="translate(170 620)">
    <circle cx="80" cy="60" r="55" fill="#8b5cf6"/>
