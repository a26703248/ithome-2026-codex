<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">30 天學習路線</title>
  <desc id="desc">六個階段依序建立心智模型、運用 ChatGPT、實作 Codex、整合工作流、導入團隊治理，並以系列回顧收尾</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <text x="70" y="85" fill="#f8fafc" font-size="46" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-weight="800">30 天：從工具認識走到團隊治理</text>
  <g transform="translate(70 155)" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif">
    <path d="M105 205H980" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <g>
      <circle cx="105" cy="205" r="35" fill="#22d3ee"/><text x="105" y="216" text-anchor="middle" fill="#082f49" font-size="28" font-weight="800">1</text>
