      <text x="105" y="121" text-anchor="middle" fill="#94a3b8" font-size="21">知道差異</text>
    </g>
    <g>
      <circle cx="284" cy="205" r="35" fill="#60a5fa"/><text x="284" y="216" text-anchor="middle" fill="#172554" font-size="28" font-weight="800">2</text>
      <rect x="197" y="270" width="174" height="140" rx="22" fill="#14213a" stroke="#60a5fa"/>
      <text x="284" y="315" text-anchor="middle" fill="#93c5fd" font-size="25" font-weight="700">Day 4–9</text>
      <text x="284" y="358" text-anchor="middle" fill="#e2e8f0" font-size="26">ChatGPT</text>
      <text x="284" y="391" text-anchor="middle" fill="#94a3b8" font-size="21">釐清與設計</text>
    </g>
    <g>
      <circle cx="463" cy="205" r="35" fill="#a78bfa"/><text x="463" y="216" text-anchor="middle" fill="#2e1065" font-size="28" font-weight="800">3</text>
      <rect x="376" y="0" width="174" height="140" rx="22" fill="#241a3b" stroke="#a78bfa"/>
      <text x="463" y="45" text-anchor="middle" fill="#c4b5fd" font-size="25" font-weight="700">Day 10–16</text>
