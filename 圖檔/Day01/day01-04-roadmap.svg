<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">30 天學習路線</title>
  <desc id="desc">五個階段依序建立心智模型、運用 ChatGPT、實作 Codex、整合工作流、導入團隊治理</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <text x="70" y="85" fill="#f8fafc" font-size="46" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-weight="800">30 天：從工具認識走到團隊治理</text>
  <g transform="translate(70 155)" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif">
    <path d="M80 205H980" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <g>
      <circle cx="80" cy="205" r="35" fill="#22d3ee"/><text x="80" y="216" text-anchor="middle" fill="#082f49" font-size="28" font-weight="800">1</text>
      <rect x="0" y="0" width="190" height="140" rx="22" fill="#102535" stroke="#22d3ee"/>
      <text x="95" y="45" text-anchor="middle" fill="#67e8f9" font-size="27" font-weight="700">Day 1–3</text>
      <text x="95" y="88" text-anchor="middle" fill="#e2e8f0" font-size="28">心智模型</text>
      <text x="95" y="121" text-anchor="middle" fill="#94a3b8" font-size="23">知道差異</text>
    </g>
    <g>
      <circle cx="310" cy="205" r="35" fill="#60a5fa"/><text x="310" y="216" text-anchor="middle" fill="#172554" font-size="28" font-weight="800">2</text>
      <rect x="215" y="270" width="190" height="140" rx="22" fill="#14213a" stroke="#60a5fa"/>
      <text x="310" y="315" text-anchor="middle" fill="#93c5fd" font-size="27" font-weight="700">Day 4–9</text>
      <text x="310" y="358" text-anchor="middle" fill="#e2e8f0" font-size="28">ChatGPT</text>
      <text x="310" y="391" text-anchor="middle" fill="#94a3b8" font-size="23">釐清與設計</text>
    </g>
    <g>
      <circle cx="540" cy="205" r="35" fill="#a78bfa"/><text x="540" y="216" text-anchor="middle" fill="#2e1065" font-size="28" font-weight="800">3</text>
      <rect x="445" y="0" width="190" height="140" rx="22" fill="#241a3b" stroke="#a78bfa"/>
      <text x="540" y="45" text-anchor="middle" fill="#c4b5fd" font-size="27" font-weight="700">Day 10–16</text>
      <text x="540" y="88" text-anchor="middle" fill="#e2e8f0" font-size="28">Codex 實作</text>
      <text x="540" y="121" text-anchor="middle" fill="#94a3b8" font-size="23">讀、改、測</text>
    </g>
    <g>
      <circle cx="770" cy="205" r="35" fill="#f59e0b"/><text x="770" y="216" text-anchor="middle" fill="#451a03" font-size="28" font-weight="800">4</text>
      <rect x="675" y="270" width="190" height="140" rx="22" fill="#302014" stroke="#f59e0b"/>
      <text x="770" y="315" text-anchor="middle" fill="#fbbf24" font-size="27" font-weight="700">Day 17–23</text>
      <text x="770" y="358" text-anchor="middle" fill="#e2e8f0" font-size="28">整合流程</text>
      <text x="770" y="391" text-anchor="middle" fill="#94a3b8" font-size="23">重構與除錯</text>
    </g>
    <g>
      <circle cx="1000" cy="205" r="35" fill="#34d399"/><text x="1000" y="216" text-anchor="middle" fill="#052e16" font-size="28" font-weight="800">5</text>
      <rect x="905" y="0" width="190" height="140" rx="22" fill="#102a26" stroke="#34d399"/>
      <text x="1000" y="45" text-anchor="middle" fill="#6ee7b7" font-size="27" font-weight="700">Day 24–30</text>
      <text x="1000" y="88" text-anchor="middle" fill="#e2e8f0" font-size="28">團隊治理</text>
      <text x="1000" y="121" text-anchor="middle" fill="#94a3b8" font-size="23">量測與制度</text>
    </g>
  </g>
  <text x="600" y="625" text-anchor="middle" fill="#94a3b8" font-size="24" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif">每一階段都保留：目標、限制、驗證與人工決策。</text>
