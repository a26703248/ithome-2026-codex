      <text x="463" y="121" text-anchor="middle" fill="#94a3b8" font-size="21">讀、改、測</text>
    </g>
    <g>
      <circle cx="642" cy="205" r="35" fill="#f59e0b"/><text x="642" y="216" text-anchor="middle" fill="#451a03" font-size="28" font-weight="800">4</text>
      <rect x="555" y="270" width="174" height="140" rx="22" fill="#302014" stroke="#f59e0b"/>
      <text x="642" y="315" text-anchor="middle" fill="#fbbf24" font-size="25" font-weight="700">Day 17–24</text>
