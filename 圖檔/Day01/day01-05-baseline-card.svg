<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Day 01 基準線紀錄卡</title>
  <desc id="desc">記錄任務時間、人工介入、測試與驗收條件，供 Day 28 比較</desc>
  <rect width="1200" height="675" fill="#0b1220"/>
  <text x="70" y="85" fill="#f8fafc" font-size="46" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-weight="800">今天先留下基準線，Day 28 再比較</text>
  <g transform="translate(70 135)" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif">
    <rect width="1060" height="460" rx="28" fill="#111827" stroke="#334155" stroke-width="3"/>
    <rect x="35" y="32" width="990" height="64" rx="15" fill="#172033"/>
    <text x="65" y="73" fill="#e2e8f0" font-size="28">任務：一項 30～90 分鐘、可驗證的 Java 小任務</text>
    <g fill="#0f1b2e" stroke="#334155">
      <rect x="35" y="125" width="300" height="125" rx="18"/><rect x="380" y="125" width="300" height="125" rx="18"/><rect x="725" y="125" width="300" height="125" rx="18"/>
      <rect x="35" y="285" width="300" height="125" rx="18"/><rect x="380" y="285" width="300" height="125" rx="18"/><rect x="725" y="285" width="300" height="125" rx="18"/>
    </g>
    <g text-anchor="middle">
      <text x="185" y="173" fill="#67e8f9" font-size="27" font-weight="700">完成時間</text><text x="185" y="215" fill="#94a3b8" font-size="24">開始 → 可審查</text>
      <text x="530" y="173" fill="#93c5fd" font-size="27" font-weight="700">提示追加</text><text x="530" y="215" fill="#94a3b8" font-size="24">幾次補充與退回</text>
      <text x="875" y="173" fill="#c4b5fd" font-size="27" font-weight="700">人工修改</text><text x="875" y="215" fill="#94a3b8" font-size="24">時間與變更量</text>
      <text x="185" y="333" fill="#fbbf24" font-size="27" font-weight="700">測試結果</text><text x="185" y="375" fill="#94a3b8" font-size="24">不是只看能否編譯</text>
      <text x="530" y="333" fill="#6ee7b7" font-size="27" font-weight="700">審查發現</text><text x="530" y="375" fill="#94a3b8" font-size="24">缺陷、風險、返工</text>
      <text x="875" y="333" fill="#fda4af" font-size="27" font-weight="700">驗收條件</text><text x="875" y="375" fill="#94a3b8" font-size="24">最後真的達成了嗎</text>
    </g>
  </g>
</svg>
