<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI 協作開發責任迴圈</title>
  <desc id="desc">人定義問題，ChatGPT 協助思考，Codex 執行，工具驗證，證據回到人做最終判斷</desc>
  <rect width="1200" height="675" fill="#08111f"/>
  <text x="600" y="80" text-anchor="middle" fill="#f8fafc" font-size="46" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" font-weight="800">AI 協作開發的責任迴圈</text>
  <g font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif" text-anchor="middle">
    <rect x="450" y="115" width="300" height="120" rx="26" fill="#172554" stroke="#60a5fa" stroke-width="4"/>
    <text x="600" y="165" fill="#fff" font-size="31" font-weight="800">人</text>
    <text x="600" y="205" fill="#bfdbfe" font-size="26">定義目標與驗收</text>
